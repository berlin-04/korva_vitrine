services:
  korva-vitrine:
    container_name: korva-vitrine-prod
    image: ${IMAGE_TAG:-korva_vitrine:latest}
    ports:
      - "8085:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

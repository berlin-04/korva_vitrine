services:
  frontend-korva_vitrine:
    build:
      context: ./frontend/korva_vitrine
      dockerfile: Dockerfile
      target: ${APP_ENV:-production}
    restart: unless-stopped
    networks:
      - proxy-net
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"
    environment:
      - NODE_ENV=${APP_ENV:-production}
      - VITE_API_URL=${VITE_API_URL:-/api}
    ports:
      - "${VITRINE_PORT:-8085}:3000"

networks:
  proxy-net:
  frontend-net:

# Included inside the main webplatform-template server block.

location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?)$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend_korva_vitrine http://frontend-korva_vitrine:3000;

    proxy_pass $upstream_frontend_korva_vitrine;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend_korva_vitrine http://frontend-korva_vitrine:3000;

    proxy_pass $upstream_frontend_korva_vitrine;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
}
